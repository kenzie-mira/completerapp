<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/modern-normalize/modern-normalize.min.css" rel="stylesheet">

    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_" />
    <link rel="stylesheet" href="/community/assets/community.css"> 
    <title>Completer App</title>
</head>

<body>
    <section class="community-wrapper">
        <aside data-import="/dashboard/module/sidebar/sidebar.html" class="community-wrapper__left"></aside>
        <main class="community-wrapper__content">
            <div class="container">
                <header class="board-header">
                     <div data-import="/tasks/module/header/header.html" data-change-text="Community Board" data-change-text2="Collaborate with your team" data-change-icon="<span class=material-symbols-rounded>groups</span>" id="board-header"></div>
                </header>

                <div class="input-section">
                    <div class="avatar km">KM</div>
                    <div class="input-wrapper">
                        <input type="text" id="userInput"
                            placeholder="Share an update, ask for help, or celebrate a win... (Mention @comsq to get AI help)">
                        <button id="postBtn">
                            <span class="material-symbols-rounded">send</span>
                            Post
                        </button>
                    </div>
                </div>

                <div id="feed" class="feed-section">
                </div>

                <div style="text-align: center; margin-top: 10px;">
                    <a href="#" id="clearStorage" style="font-size: 12px; color: #999; text-decoration: none;">Reset
                        Board (Clear Local Storage)</a>
                </div>
            </div>
        </main>
    </section>
</body>
<script src="/dashboard/assets/global.js"></script>
<script src="/community/assets/community.js"></script>

</html>
